<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Velora</title>
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="page__main">
        <section class="page-hero wrap">
          <span class="eyebrow">Contact</span>
          <h1>Write to the atelier</h1>
        </section>
        <section class="wrap">
          <form class="form">
            <label class="field"><span>Name</span><input type="text" /></label>
            <label class="field"><span>Email</span><input type="email" /></label>
            <label class="field"><span>Message</span><textarea rows="5"></textarea></label>
            <button class="btn" type="button">Send (coming soon)</button>
          </form>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script type="module" src="/src/pages/shell.ts"></script>
  </body>
</html>
