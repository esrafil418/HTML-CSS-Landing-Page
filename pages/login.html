<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Velora</title>
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="page__main">
        <section class="page-hero wrap">
          <span class="eyebrow">Account</span>
          <h1>Sign in</h1>
          <p>Supabase Auth will power this form in Phase 4.</p>
        </section>
        <section class="wrap">
          <form class="form">
            <label class="field"><span>Email</span><input type="email" autocomplete="email" /></label>
            <label class="field"><span>Password</span><input type="password" autocomplete="current-password" /></label>
            <button class="btn" type="button">Sign in (coming soon)</button>
            <p><a href="./register.html">Create an account</a></p>
          </form>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script type="module" src="/src/pages/shell.ts"></script>
  </body>
</html>
