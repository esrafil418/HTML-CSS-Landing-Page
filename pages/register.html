<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Velora</title>
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="page__main">
        <section class="page-hero wrap">
          <span class="eyebrow">Account</span>
          <h1>Create account</h1>
        </section>
        <section class="wrap">
          <form class="form">
            <label class="field"><span>Full name</span><input type="text" autocomplete="name" /></label>
            <label class="field"><span>Email</span><input type="email" autocomplete="email" /></label>
            <label class="field"><span>Password</span><input type="password" autocomplete="new-password" /></label>
            <button class="btn" type="button">Register (coming soon)</button>
          </form>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script type="module" src="/src/pages/shell.ts"></script>
  </body>
</html>
