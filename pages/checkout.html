<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Velora</title>
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="page__main">
        <section class="page-hero wrap">
          <span class="eyebrow">Checkout</span>
          <h1>Complete your order</h1>
          <p class="notice">Checkout is scaffolded. Stripe or a mock payment flow is planned in Phase 5.</p>
        </section>
        <section class="wrap">
          <form class="form">
            <label class="field"><span>Email</span><input type="email" autocomplete="email" /></label>
            <label class="field"><span>Full name</span><input type="text" autocomplete="name" /></label>
            <label class="field"><span>Address</span><input type="text" autocomplete="street-address" /></label>
            <button class="btn" type="button">Place order (coming soon)</button>
          </form>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script type="module" src="/src/pages/shell.ts"></script>
  </body>
</html>
